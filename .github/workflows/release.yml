name: Release

# On every push to main: if there are pending changesets, open (or update) a
# "Version Packages" PR that consumes them and bumps package.json + writes
# CHANGELOG. When that PR is merged there are no pending changesets, so the
# action publishes to the registry instead.
#
# Required secrets:
#   NPM_TOKEN  — automation token with publish access for @textcortex scope.
#                If absent, the publish step is skipped (the Version Packages
#                PR still gets opened).
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets needs full history to compute changelog deltas.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Note: do NOT pass `registry-url` here. setup-node would write a
      # second .npmrc at $RUNNER_TEMP/.npmrc and point NPM_CONFIG_USERCONFIG
      # at it, with auth pulled from NODE_AUTH_TOKEN. We don't set
      # NODE_AUTH_TOKEN, so that .npmrc ends up dead, and changesets/action's
      # own ~/.npmrc (built from NPM_TOKEN) gets ignored — npm publish then
      # 404s with no auth. Letting changesets/action manage auth is enough.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm run typecheck

      - name: Test (library)
        run: pnpm run test

      - name: Build library bundle
        run: pnpm run build:lib

      # Attribute release commits + GitHub release tags to a real maintainer
      # rather than github-actions[bot]. Use the GitHub-issued no-reply email
      # so the commit links to the user profile without leaking a real address.
      - name: Configure git user for release commits
        run: |
          git config --global user.name "karthikmudunuri"
          git config --global user.email "102793643+karthikmudunuri@users.noreply.github.com"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # Bump versions and update CHANGELOG when a Version Packages PR is
          # opened/updated; publish to the registry when it merges.
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          # Don't let the action overwrite the git identity we just set.
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
